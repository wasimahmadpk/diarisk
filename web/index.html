<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DiaRisk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef3f1;
      --ink: #16302a;
      --muted: #5a6f69;
      --card: #ffffff;
      --line: #d5e0db;
      --accent: #0e6b58;
      --low: #1f7a4d;
      --mod: #b86a12;
      --high: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 320px at 80% -10%, #d9ebe4, transparent),
        var(--bg);
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 48px 20px 72px; }
    h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(2rem, 4vw, 2.6rem);
      margin: 0 0 8px;
    }
    .lede { color: var(--muted); margin: 0 0 28px; max-width: 40rem; line-height: 1.5; }
    .layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 16px 40px rgba(22, 48, 42, 0.06);
    }
    h2 { font-size: 1.05rem; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; font-weight: 600; }
    input {
      font: inherit;
      font-weight: 400;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      margin-top: 18px;
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 12px 16px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: wait; }
    .result .placeholder { color: var(--muted); line-height: 1.5; }
    .badge {
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .low { background: #e3f5eb; color: var(--low); }
    .moderate { background: #f8ead6; color: var(--mod); }
    .high { background: #fde8e6; color: var(--high); }
    .pct {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 3.4rem;
      line-height: 1;
      margin: 12px 0 6px;
    }
    .pct span { font-size: 1.2rem; color: var(--muted); }
    .err { color: var(--high); }
    .fine { margin-top: 22px; font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
    @media (max-width: 720px) {
      .layout, .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DiaRisk</h1>
    <p class="lede">Estimate diabetes risk from eight clinical measurements. This is decision support, not a diagnosis.</p>
    <div class="layout">
      <form class="card" id="form">
        <h2>Measurements</h2>
        <div class="grid">
          <label>Pregnancies <input name="pregnancies" type="number" min="0" step="1" value="2" required /></label>
          <label>Glucose (mg/dL) <input name="glucose" type="number" min="0" step="1" value="140" required /></label>
          <label>Blood pressure (mmHg) <input name="blood_pressure" type="number" min="0" step="1" value="72" required /></label>
          <label>Skin thickness (mm) <input name="skin_thickness" type="number" min="0" step="1" value="35" required /></label>
          <label>Insulin (µU/mL) <input name="insulin" type="number" min="0" step="1" value="110" required /></label>
          <label>BMI <input name="bmi" type="number" min="0" step="0.1" value="32.5" required /></label>
          <label>Diabetes pedigree <input name="diabetes_pedigree" type="number" min="0" step="0.01" value="0.55" required /></label>
          <label>Age (years) <input name="age" type="number" min="0" step="1" value="45" required /></label>
        </div>
        <button type="submit">Assess risk</button>
      </form>
      <aside class="card result">
        <h2>Result</h2>
        <div id="out"><p class="placeholder">Enter values and assess risk to see the model output.</p></div>
        <p class="fine">Trained on the Pima Indians Diabetes dataset. Confirm findings with a clinician.</p>
      </aside>
    </div>
  </div>
  <script>
    const API = "https://b2je1touwh.execute-api.eu-north-1.amazonaws.com";
    const out = document.getElementById("out");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {};
      for (const el of e.target.elements) {
        if (el.name) payload[el.name] = Number(el.value);
      }
      out.innerHTML = "<p class='placeholder'>Scoring…</p>";
      e.target.querySelector("button").disabled = true;
      try {
        const res = await fetch(API + "/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await res.json();
        if (!res.ok) {
          out.innerHTML = "<p class='err'>Prediction failed.</p>";
          return;
        }
        const pct = Math.round(body.diabetes_probability * 100);
        const label = body.diabetes_prediction === 1 ? "positive" : "negative";
        out.innerHTML =
          "<p class='badge " + body.risk_level + "'>" + body.risk_level + " risk</p>" +
          "<p class='pct'>" + pct + "<span>%</span></p>" +
          "<p class='placeholder'>Estimated probability of diabetes. Class: <strong>" + label + "</strong>.</p>";
      } catch (err) {
        out.innerHTML = "<p class='err'>Could not reach the model. Try again.</p>";
      } finally {
        e.target.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
