name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: diarisk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS App Runner
    runs-on: ubuntu-latest
    needs: test
    # Enable by setting the repository variable AWS_DEPLOY to "true"
    # (see docs/AWS_SETUP.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # App Runner has auto-deployments enabled, so pushing :latest already
      # starts a rollout. Here we only wait for it and report the URL.
      - name: Wait for rollout
        env:
          SERVICE_ARN: ${{ vars.APPRUNNER_SERVICE_ARN }}
        run: |
          for _ in $(seq 1 60); do
            status=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" \
              --query 'Service.Status' --output text)
            echo "status: $status"
            case "$status" in
              RUNNING) break ;;
              CREATE_FAILED|DELETED|PAUSED) echo "unexpected status"; exit 1 ;;
            esac
            sleep 15
          done
          url=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" \
            --query 'Service.ServiceUrl' --output text)
          echo "https://$url" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "https://$url/health"
