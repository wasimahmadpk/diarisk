<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DiaRisk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f8f6;
      --panel: #ffffff;
      --ink: #1a2420;
      --muted: #66736d;
      --line: #e4eae6;
      --accent: #0f7a64;
      --low: #157a48;
      --mod: #a05c0c;
      --high: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
    }
    .wrap { max-width: 840px; margin: 0 auto; padding: 40px 20px 80px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 36px; }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 1.65rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .lede { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
    .tabs {
      display: flex;
      padding: 4px;
      background: #eef1ef;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .tabs button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tabs button.active { background: var(--accent); color: #fff; }
    .panel { display: none; }
    .panel.show { display: block; }
    .layout { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(26, 36, 32, 0.04);
    }
    h2 { margin: 0 0 16px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--muted); }
    input {
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .go {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .go:disabled { opacity: 0.55; cursor: wait; }
    .result { min-height: 280px; display: flex; flex-direction: column; }
    .placeholder { color: var(--muted); line-height: 1.55; margin: 0; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .low { background: #e6f6ee; color: var(--low); }
    .moderate { background: #f8edd9; color: var(--mod); }
    .high { background: #fde8e6; color: var(--high); }
    .pct {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 4.2rem;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 18px 0 10px;
    }
    .pct span { font-size: 1.15rem; color: var(--muted); }
    .err { color: var(--high); }
    .fine { margin: auto 0 0; padding-top: 18px; font-size: 0.75rem; color: var(--muted); line-height: 1.45; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .metric span { display: block; color: var(--muted); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 8px; font-size: 1.35rem; font-weight: 500; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    svg.spark { width: 100%; height: 88px; }
    @media (max-width: 720px) {
      header { flex-direction: column; }
      .layout, .grid, .metrics, .charts { grid-template-columns: 1fr 1fr; }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .grid, .metrics, .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>DiaRisk</h1>
        <p class="lede">Eight measurements. One risk estimate. Not a diagnosis.</p>
      </div>
      <nav class="tabs">
        <button type="button" class="active" data-tab="assess">Assess</button>
        <button type="button" data-tab="monitor">Monitor</button>
      </nav>
    </header>

    <div id="assess" class="panel show">
      <div class="layout">
        <form class="card" id="form">
          <h2>Inputs</h2>
          <div class="grid">
            <label>Pregnancies <input name="pregnancies" type="number" min="0" step="1" value="2" required /></label>
            <label>Glucose (mg/dL) <input name="glucose" type="number" min="0" step="1" value="140" required /></label>
            <label>Blood pressure <input name="blood_pressure" type="number" min="0" step="1" value="72" required /></label>
            <label>Skin thickness <input name="skin_thickness" type="number" min="0" step="1" value="35" required /></label>
            <label>Insulin (µU/mL) <input name="insulin" type="number" min="0" step="1" value="110" required /></label>
            <label>BMI <input name="bmi" type="number" min="0" step="0.1" value="32.5" required /></label>
            <label>Pedigree <input name="diabetes_pedigree" type="number" min="0" step="0.01" value="0.55" required /></label>
            <label>Age <input name="age" type="number" min="0" step="1" value="45" required /></label>
          </div>
          <button class="go" type="submit">Assess risk</button>
        </form>
        <aside class="card result">
          <h2>Estimate</h2>
          <div id="out"><p class="placeholder">Fill the form, then assess.</p></div>
          <p class="fine">Model trained on the Pima Indians Diabetes cohort. Confirm with a clinician.</p>
        </aside>
      </div>
    </div>

    <div id="monitor" class="panel">
      <div class="metrics" id="metric-cards"></div>
      <div class="charts" id="charts"></div>
      <div class="metrics" id="drift-cards" style="margin-top:12px"></div>
      <p class="fine" id="stats-meta" style="margin-top:16px">CloudWatch totals for the last 72 hours.</p>
      <p class="fine" id="drift-meta"></p>
    </div>
  </div>
  <script>
    const API = "https://b2je1touwh.execute-api.eu-north-1.amazonaws.com";
    const out = document.getElementById("out");

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("show"));
        document.getElementById(btn.dataset.tab).classList.add("show");
        if (btn.dataset.tab === "monitor") { loadStats(); loadDrift(); }
      });
    });

    function spark(points) {
      if (!points || !points.length) return "<svg class='spark'></svg>";
      const vals = points.map((p) => Number(p.v));
      const max = Math.max(...vals, 1);
      const w = 320, h = 88, pad = 8;
      const step = (w - pad * 2) / Math.max(vals.length - 1, 1);
      const coords = vals.map((v, i) => {
        const x = pad + i * step;
        const y = h - pad - (v / max) * (h - pad * 2);
        return [x, y];
      });
      const line = coords.map((c, i) => (i ? "L" : "M") + c[0] + " " + c[1]).join(" ");
      const area = line + " L" + coords[coords.length - 1][0] + " " + (h - pad) + " L" + coords[0][0] + " " + (h - pad) + " Z";
      return "<svg class='spark' viewBox='0 0 " + w + " " + h + "' preserveAspectRatio='none'><path d='" + area + "' fill='rgba(15,122,100,0.12)'/><path d='" + line + "' fill='none' stroke='#0f7a64' stroke-width='2'/></svg>";
    }

    function fmt(v, suffix) {
      if (v === null || v === undefined) return "—";
      const n = Number(v);
      if (Number.isNaN(n)) return "—";
      return (Number.isInteger(n) ? n : n.toFixed(1)) + (suffix || "");
    }

    async function loadStats() {
      const cards = document.getElementById("metric-cards");
      const charts = document.getElementById("charts");
      cards.innerHTML = "<p class='placeholder'>Loading…</p>";
      charts.innerHTML = "";
      try {
        const res = await fetch(API + "/stats?hours=72");
        const s = await res.json();
        if (!res.ok) throw new Error("stats failed");
        const L = s.lambda || {};
        const A = s.api || {};
        const items = [
          ["Requests", fmt(A.requests)],
          ["Invocations", fmt(L.invocations)],
          ["Errors", fmt(L.errors)],
          ["Latency", fmt(A.latency_avg_ms, " ms")],
          ["4xx", fmt(A.status_4xx)],
          ["5xx", fmt(A.status_5xx)],
          ["p95", fmt(L.duration_p95_ms, " ms")],
          ["Throttles", fmt(L.throttles)],
        ];
        cards.innerHTML = items.map(([k, v]) => "<div class='metric'><span>" + k + "</span><strong>" + v + "</strong></div>").join("");
        const series = s.series || {};
        charts.innerHTML =
          "<div class='card'><h2>Invocations</h2>" + spark(series.invocations) + "</div>" +
          "<div class='card'><h2>HTTP requests</h2>" + spark(series.api_requests) + "</div>";
        document.getElementById("stats-meta").textContent =
          "Last " + s.window_hours + "h · " + (s.region || "") + " · " + (s.generated_at || "");
      } catch (err) {
        cards.innerHTML = "<p class='err'>Could not load metrics.</p>";
      }
    }

    async function loadDrift() {
      const box = document.getElementById("drift-cards");
      const meta = document.getElementById("drift-meta");
      box.innerHTML = "";
      meta.textContent = "";
      try {
        const res = await fetch(API + "/drift?hours=72");
        const d = await res.json();
        if (!res.ok) throw new Error("drift failed");
        const data = d.data || {};
        const score = d.score || {};
        const items = [
          ["Live samples", fmt(d.n_current)],
          ["Data drift", data.data_drift ? "yes" : (d.insufficient_sample ? "need 30+" : "no")],
          ["Score drift", score.score_drift ? "yes" : (d.insufficient_sample ? "need 30+" : "no")],
          ["Max PSI", fmt(data.max_psi)],
          ["Mean score", fmt(score.mean)],
          ["Baseline mean", fmt(score.baseline_mean)],
          ["Positive rate", fmt(score.positive_rate)],
          ["Baseline pos.", fmt(score.baseline_positive_rate)],
        ];
        box.innerHTML = items.map(([k, v]) => "<div class='metric'><span>" + k + "</span><strong>" + v + "</strong></div>").join("");
        const drifted = (data.drifted_features || []).join(", ") || "none";
        meta.textContent = (score.note || "Score drift is not labeled accuracy.") + " Shifted features: " + drifted + ".";
      } catch (err) {
        box.innerHTML = "<p class='placeholder'>Live drift needs the updated API (table + /drift).</p>";
      }
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {};
      for (const el of e.target.elements) {
        if (el.name) payload[el.name] = Number(el.value);
      }
      out.innerHTML = "<p class='placeholder'>Scoring…</p>";
      e.target.querySelector("button").disabled = true;
      try {
        const res = await fetch(API + "/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await res.json();
        if (!res.ok) {
          out.innerHTML = "<p class='err'>Prediction failed.</p>";
          return;
        }
        const pct = Math.round(body.diabetes_probability * 100);
        const label = body.diabetes_prediction === 1 ? "positive" : "negative";
        out.innerHTML =
          "<p class='badge " + body.risk_level + "'>" + body.risk_level + "</p>" +
          "<p class='pct'>" + pct + "<span>%</span></p>" +
          "<p class='placeholder'>Estimated probability. Class " + label + ".</p>";
      } catch (err) {
        out.innerHTML = "<p class='err'>Could not reach the model.</p>";
      } finally {
        e.target.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
